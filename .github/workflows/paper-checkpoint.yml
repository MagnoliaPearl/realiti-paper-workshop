name: Washi paper checkpoint tests
on:
  push:
    branches: [prototype/two-fold-persistence]
  pull_request:
permissions:
  contents: read
jobs:
  paper-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fold and return
        run: node test/paper-sheet.test.cjs
